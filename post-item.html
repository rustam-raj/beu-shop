<script src="./assets/js/colleges.js"></script>
  <script type="module" src="./assets/js/post.js"></script>
  <script>
    lucide.createIcons();

    const collegeDropdown = document.getElementById('college');
    if (typeof beuColleges !== 'undefined' && collegeDropdown) {
      beuColleges.forEach(col => {
        const opt = document.createElement('option');
        opt.value = col;
        opt.textContent = col;
        collegeDropdown.appendChild(opt);
      });
    }
  </script>
</body>
</html>
